# 🏗️ بناء لوحة إدارة منبر وتوقيعها ونشرها — كلّه على شبكة GitHub لا شبكة المالك.
#
# ⛔ **قاعدة المالك (2026-09-12): اللوحة تُنشر على «الاختبار المغلق» دائماً** — لا
#    إنتاج مباشر منها أبداً؛ الترقية إلى الإنتاج قراره وحده من Play Console.
#    (أما تطبيق منبر العامّ فيُنشر إلى الإنتاج مباشرةً — انظر مستودعه.)
#
# 🔐 الشيفرة عامّة والأسرار خاصّة: `workflow_dispatch` وحده (لصاحب صلاحية الكتابة)،
#    ⛔ ولا يُضاف `pull_request_target` ولا `issue_comment` أبداً (بابا تسريب الأسرار)،
#    و`contents: read`، والمفتاح في مجلّد مؤقّت يُمحى دائماً ويُمرَّر بمتغيّرات بيئة،
#    والإجراء الخارجي مثبَّت ببصمة إيداعه.
name: build-publish
#
# 🚀 **الدمج ينشر** (كما في مستودع التطبيق): تغيُّرُ `versionCode` في `main`
#    يبني ويوقّع وينشر إلى **الاختبار المغلق**. وهذا هو الزنادُ الوحيد الذي
#    تملكه جلسةٌ سحابيّة، لأنّ جلسات كلود **لا تُشغّل سيرَ عمل** — منعٌ من
#    منصّة أنثروبيك لا من صلاحيّات المستودع، فلا يرفعه أيّ دورٍ يمنحه المالك.
#    ⛔ والحارس: لا يُبنى شيءٌ إلا إن تغيّر الرقم فعلاً في هذه الدفعة.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "مسار Play (اتركه alpha = الاختبار المغلق)"
        default: "alpha"
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
permissions:
  contents: read
concurrency:
  group: minbar-admin-play-publish
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "🖐️ تشغيلٌ يدويّ — البوّابة مفتوحة."
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ⛔ سطرُ الإسناد وحده لا أيّ ذِكر: تعليقٌ في build.gradle.kts يقول «versionCode=2001»
          #    فكانت البوّابة تقرأ 2001 في الطرفين وتقف دائماً — لم يُنشر 2025 لهذا (2026-09-25).
          read_code() { grep -m1 -oE '^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*[0-9]+' | grep -oE '[0-9]+'; }
          cur=$(read_code < app/build.gradle.kts)
          prev=$(git show HEAD^:app/build.gradle.kts 2>/dev/null | read_code || echo "")
          echo "السابق: ${prev:-«لا سابق»} · الحالي: $cur"
          if [ -n "$prev" ] && [ "$prev" = "$cur" ]; then
            echo "⏸️ رقم الإصدار لم يتغيّر — لا بناءَ ولا نشر."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "🚀 رقم الإصدار صار $cur — البناء والنشر إلى الاختبار المغلق."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KS: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: الاختبارات
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --no-daemon
      - name: مفتاح التوقيع
        if: env.HAS_KS == 'true'
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"
      - name: بناء الحزمة
        env:
          MINBAR_ADMIN_SIGNING_STORE_FILE: ${{ runner.temp }}/upload.jks
          MINBAR_ADMIN_SIGNING_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          MINBAR_ADMIN_SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          MINBAR_ADMIN_SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: تحقّق
        run: |
          set +e
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          ls -la "$AAB"
          unzip -l "$AAB" > /tmp/list.txt
          echo "المعالجات: $(grep -oE 'lib/[a-z0-9_-]+/' /tmp/list.txt | sort -u | xargs)"
          jarsigner -verify "$AAB" > /tmp/js.txt 2>&1
          grep -m1 -E 'jar verified|jar is unsigned' /tmp/js.txt || tail -3 /tmp/js.txt
          keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -m1 'SHA1:'
          grep -qm1 'jar verified' /tmp/js.txt || { echo '⛔ غير موقّعة'; exit 1; }
          # حارس التوافق: حصرُ معالجٍ واحد أسقط ٩٬٤٣٢ جهازاً في ٢٠٢٣ ورفضه Play.
          n=$(grep -oE 'lib/[a-z0-9_-]+/' /tmp/list.txt | sort -u | wc -l)
          [ "$n" -ge 4 ] || { echo "⛔ المعالجات $n < 4 — توافق الأجهزة ناقص"; exit 1; }
      - name: محو المفتاح من العدّاء
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: النشر إلى Play (الاختبار المغلق)
        if: env.HAS_PLAY == 'true' && env.HAS_KS == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ali.ishaqiyin_admin
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'alpha' }}
          status: completed
      - uses: actions/upload-artifact@v4
        with:
          name: minbar-admin-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7
